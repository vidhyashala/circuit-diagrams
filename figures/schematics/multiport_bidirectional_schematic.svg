<rect x="940" y="200" width="230" height="120" rx="10" ry="10" fill="#f0fdf4" stroke="#1f2937" stroke-width="2.5"/><text x="1055.0" y="266.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">Bus Active Rectifier
Qr1..Qr4</text>
<rect x="1240" y="210" width="100" height="70" rx="10" ry="10" fill="#f8fafc" stroke="#1f2937" stroke-width="2.5"/><text x="1290.0" y="251.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">Lout</text>
<rect x="1380" y="210" width="100" height="70" rx="10" ry="10" fill="#fff7ed" stroke="#1f2937" stroke-width="2.5"/><text x="1430.0" y="251.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">Co</text>
<rect x="1330" y="360" width="200" height="80" rx="10" ry="10" fill="#eef2ff" stroke="#1f2937" stroke-width="2.5"/><text x="1430.0" y="406.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">400V Bus/Load</text>
<line x1="240" y1="160" x2="300" y2="165" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="240" y1="360" x2="300" y2="365" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="520" y1="165" x2="610" y2="245" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="520" y1="365" x2="610" y2="285" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="860" y1="260" x2="940" y2="260" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1170" y1="260" x2="1240" y2="245" stroke="#111827" stroke-width="3"/>
<line x1="1340" y1="245" x2="1380" y2="245" stroke="#111827" stroke-width="3"/>
<line x1="1430" y1="280" x2="1430" y2="360" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
<text x="70" y="610" font-family="Arial" font-size="20" fill="#374151">Switching: phase-shifted bridges with synchronous bidirectional operation.</text>
<text x="70" y="645" font-family="Arial" font-size="20" fill="#374151">Power flow: PV -> bus, battery <-> bus (charge/discharge), autonomous support via droop control.</text>
</svg>