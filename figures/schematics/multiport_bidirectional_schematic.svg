<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#fcfcfd"/>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a"/>
  </marker>
</defs>
<text x="40" y="48" font-family="Arial" font-size="34" font-weight="bold" fill="#0f172a">Multi-Port Bidirectional Converter (PV + Battery + Load)</text>
<rect x="60" y="120" width="180" height="80" rx="10" ry="10" fill="#eef2ff" stroke="#1f2937" stroke-width="2.5"/><text x="150.0" y="166.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">PV Port
24-48V</text>
<rect x="60" y="320" width="180" height="80" rx="10" ry="10" fill="#eef2ff" stroke="#1f2937" stroke-width="2.5"/><text x="150.0" y="366.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">Battery Port
36-60V</text>
<rect x="300" y="120" width="220" height="90" rx="10" ry="10" fill="#f0fdf4" stroke="#1f2937" stroke-width="2.5"/><text x="410.0" y="171.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">PV Half-Bridge
Qpv1,Qpv2</text>
<rect x="300" y="320" width="220" height="90" rx="10" ry="10" fill="#f0fdf4" stroke="#1f2937" stroke-width="2.5"/><text x="410.0" y="371.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">Bi-dir Bridge
Qb1,Qb2</text>
<rect x="610" y="200" width="250" height="160" rx="10" ry="10" fill="#fef3c7" stroke="#1f2937" stroke-width="2.5"/><text x="735.0" y="286.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111827">Three-Winding
